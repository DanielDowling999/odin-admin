<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <div class="main-container">
        <div class="side-bar">
            <div class="side-content">
                <div class="side-header">
                    <img class="logo" src="images/icons/developer-board.svg" alt="Dashboard">
                    <p>Dashboard</p>
                </div>
                <div class="nav-section">
                    <a href="index.html"><img class="icon icon-white" src="images/icons/home-analytics.svg" alt="profile">Home</a>
                    <a href="index.html"><img class="icon icon-white" src="images/icons/card-account-details-outline.svg" alt="Profile">Profile</a>
                    <a href="index.html"><img class= "icon icon-white" src="images/icons/message-reply.svg" alt="Messages">Messages</a>
                    <a href="index.html"><img class= "icon icon-white" src="images/icons/clock-time-four.svg" alt="History">History</a>
                    <a href="index.html"><img class= "icon icon-white" src="images/icons/file-cabinet.svg" alt="Tasks">Tasks</a>
                    <a href="index.html"><img class= "icon icon-white" src="images/icons/crowd.svg" alt="Communities">Communities</a>
                </div>
                <div class="nav-section">
                    <a href="index.html"><img class= "icon icon-white" src="images/icons/cog.svg" alt="Settings">Settings</a>
                    <a href="index.html"><img class= "icon icon-white" src="images/icons/account-question.svg" alt="Support">Support</a>
                    <a href="index.html"><img class= "icon icon-white" src="images/icons/shield-lock.svg" alt="Privacy">Privacy</a>
                </div>
            </div>
        </div>
        <div class="header-bar">
            <div class="search-bar">
                <img class="icon" src="images/icons/magnify.svg" alt="search button">
                <div class="search"><input type="search"></div>
            </div>
            <div class="alerts-bar">
                <a href="index.html"><img class="icon dash-icon" src="images/icons/bell-outline.svg" alt="Alerts"></a>
                <div class="pic-wrapper">
                    <img class="pic" src="images/pics/johnny.jpg" alt="Profile Pic Small">
                </div>
                <p>Johnny Joestar</p>
            </div>
            <div class="greeting-row">
                <div class="greeting">
                    <div class="pic-wrapper main-pic">
                        <img class="pic" src="images/pics/johnny.jpg" alt="Profile Pic Large">
                    </div>
                    <div class="greeting-text">
                        <p>Hi there,</p>
                        <h1>Johnny Joestar (@tusk)</h1>
                    </div>

                </div>
            </div>
            <div class="dash-buttons">
                <button>New</button>
                <button>Upload</button>
                <button>Share</button>
            </div>
        </div>
        <div class="dash-container">
            <div class="projects-container">
                <div class="project-box"></div>
                <div class="project-box"></div>
                <div class="project-box"></div>
                <div class="project-box"></div>
                <div class="project-box"></div>
                <div class="project-box"></div>
            </div>
            <div class="announcements-container">
            
            </div>
            <div class="trending-container">
            
            </div>
        </div>
    </div>
</body>
</html>
